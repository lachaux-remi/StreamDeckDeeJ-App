packages:
  - packages/*

allowBuilds:
  '@streamdeck-deej/windows-audio-native': true
  '@serialport/bindings-cpp': true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-hid: true
blockExoticSubdeps: false
overrides:
