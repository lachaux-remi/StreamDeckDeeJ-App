  '@xmldom/xmldom@<0.8.15': ^0.8.15
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  browserslist@<4.28.7: ^4.28.7
  fast-copy@>=4.0.0 <4.1.0: ^4.1.0
  fast-uri@>=3.0.0 <3.1.8: ^3.1.8
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  http-cache-semantics@<4.2.1: ^4.2.1
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  js-yaml@>=5.0.0 <5.4.1: ^5.4.1
  lodash@>=4.0.0 <=4.17.23: ^4.17.24
  minimatch@<3.1.4: ^3.1.4
  minimatch@>=5.0.0 <5.1.8: ^5.1.8
  minimatch@>=9.0.0 <9.0.7: ^9.0.7
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  tmp@<0.2.6: ^0.2.6
  undici@>=6.0.0 <6.28.1: ^6.28.1
  undici@>=7.0.0 <7.29.1: ^7.29.1
  undici@>=8.0.0 <8.10.2: ^8.10.2
auditConfig:
  ignoreGhsas:
    # sprintf-js <=1.1.3 has no patched release yet; it is only reached at
    # build time through electron-builder > @electron/get > global-agent > roarr.
    - GHSA-hp3w-g68c-fv3c
