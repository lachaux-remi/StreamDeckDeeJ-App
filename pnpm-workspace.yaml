packages:
  - packages/*

allowBuilds:
  '@streamdeck-deej/windows-audio-native': true
  '@serialport/bindings-cpp': true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-hid: true
blockExoticSubdeps: false
auditConfig:
  ignoreGhsas:
    # sprintf-js <=1.1.3 has no patched release yet; it is only reached at
    # build time through electron-builder > @electron/get > global-agent > roarr.
    - GHSA-hp3w-g68c-fv3c
