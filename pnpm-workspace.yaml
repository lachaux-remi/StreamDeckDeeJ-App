packages:
  - packages/*

allowBuilds:
  '@streamdeck-deej/windows-audio-native': true
  '@serialport/bindings-cpp': true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-hid: true
blockExoticSubdeps: false
overrides:
  # @electron/get 3 (electron-builder) optionally loads global-agent 3 for proxy
  # downloads, which pulls roarr 2 and sprintf-js <=1.1.3 (GHSA-hp3w-g68c-fv3c,
  # no patched release). global-agent 4 keeps the same bootstrap() API without them.
  global-agent@<4: ^4.1.3
