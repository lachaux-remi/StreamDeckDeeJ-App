appId: fr.remi-lachaux.streamdeck-deej
productName: streamdeck-deej
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!dist/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.json,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/logo.png
    to: logo.png
linux:
  target:
    - AppImage
    - pacman
  maintainer: contact@remi-lachaux.fr
  category: Utility
  icon: resources/logo.png
  syncDesktopName: true
appImage:
  artifactName: ${name}-${version}.${ext}
pacman:
  artifactName: ${name}-${version}.pkg.tar.xz
  compression: xz
