appId: fr.remi-lachaux.streamdeck-deej
productName: streamdeck-deej
directories:
  buildResources: build
publish:
  provider: github
  owner: lachaux-remi
  repo: StreamDeckDeeJ-App
  private: false
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/**/*'
  - '!**/{test,tests,__tests__}/**/*'
  - '!coverage/**/*'
  - '!scripts/*'
  - '!packages/**/*'
  - '!**/node_modules/@streamdeck-deej/windows-audio-native/**/*'
  - '!dist/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.json,tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.test.json,vitest.config.mts}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!**/*.map'
  - '!**/node_modules/node-hid/{hidapi,src}/**/*'
  - '!**/node_modules/node-hid/prebuilds/{HID-darwin-*,HID-win32-*,HID-linux-arm,HID-linux-arm64,HID-linux-x64-musl,HID_hidraw-linux-arm,HID_hidraw-linux-arm64,HID_hidraw-linux-x64-musl}/**/*'
  - '!**/node_modules/@serialport/bindings-cpp/src/**/*'
  - '!**/node_modules/@serialport/bindings-cpp/prebuilds/{android-*,darwin-*,linux-arm,linux-arm64,win32-*}/**/*'
asarUnpack:
  - resources/**
  - '**/node_modules/**/*.node'
extraResources:
  - from: resources/logo.png
    to: logo.png
  - from: resources/icon.ico
    to: icon.ico
linux:
  target:
    - AppImage
    - pacman
  maintainer: contact@remi-lachaux.fr
  category: Utility
  icon: resources/logo.png
  syncDesktopName: true
  extraResources:
    - from: build/linux/70-streamdeck-deej.rules
      to: linux/70-streamdeck-deej.rules
    - from: build/linux/install-udev-rule
      to: linux/install-udev-rule
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: streamdeck-deej-${version}-windows-x64.${ext}
  extraResources:
    - from: node_modules/@streamdeck-deej/windows-audio-native
      to: app.asar.unpacked/node_modules/@streamdeck-deej/windows-audio-native
      filter:
        - index.cjs
        - package.json
        - build/Release/windows_audio.node
  signExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
appImage:
  artifactName: ${name}-${version}.${ext}
pacman:
  artifactName: ${name}-${version}.pkg.tar.xz
  compression: xz
  afterInstall: build/linux/after-install.tpl
  afterRemove: build/linux/after-remove.tpl
  depends:
    - c-ares
    - ffmpeg
    - gtk3
    - http-parser
    - libevent
    - libvpx
    - libxslt
    - libxss
    - minizip
    - nss
    - re2
    - snappy
    - libnotify
    - libappindicator-gtk3
    - dbus
    - libpulse
    - pipewire
    - wireplumber
