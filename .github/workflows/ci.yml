name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      package_linux:
        description: Build and inspect Linux distribution artifacts
        type: boolean
        default: true
      checkout_ref:
        description: Immutable ref to check out
        type: string
        default: ''
      expected_tag:
        description: Exact release tag expected at checkout
        type: string
        default: ''
      expected_version:
        description: Package version expected for a release build
        type: string
        default: ''
      artifact_name:
        description: Name used to transfer verified release artifacts
        type: string
        default: ''

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Install native build and smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus-bin libarchive-tools libusb-1.0-0-dev libudev-dev pipewire-bin pulseaudio-utils wireplumber xvfb

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'electron-builder.yml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Validate workflows
        run: |
          actionlint_version=1.7.12
          actionlint_archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/${actionlint_archive}"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint
          /tmp/actionlint -color

      - name: Check formatting
        run: pnpm exec prettier --check .github/workflows/*.yml electron-builder.yml package.json scripts tests

      - name: Typecheck tests
        run: pnpm typecheck:test

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit dependencies
        run: pnpm audit --audit-level low

      - name: Package Linux
        if: ${{ github.event_name == 'pull_request' || inputs.package_linux }}
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          XZ_DEFAULTS: -T2
        run: |
          if [[ -n "$EXPECTED_TAG" ]]; then
            test "$(git tag --points-at HEAD)" = "$EXPECTED_TAG"
            test "$(node --print 'require("./package.json").version')" = "$EXPECTED_VERSION"
          fi

          rm -rf build coverage dist out
          pnpm package:linux

      - name: Verify Linux update metadata
        if: ${{ github.event_name == 'pull_request' || inputs.package_linux }}
        run: pnpm verify:update-metadata

      - name: Verify Electron fuses
        if: ${{ github.event_name == 'pull_request' || inputs.package_linux }}
        run: |
          fuses="$(pnpm exec electron-fuses read --app dist/linux-unpacked/streamdeck-deej)"
          printf '%s\n' "$fuses"
          grep -F 'RunAsNode is Disabled' <<<"$fuses"
          grep -F 'EnableNodeOptionsEnvironmentVariable is Disabled' <<<"$fuses"
          grep -F 'EnableNodeCliInspectArguments is Disabled' <<<"$fuses"
          grep -F 'EnableEmbeddedAsarIntegrityValidation is Enabled' <<<"$fuses"
          grep -F 'OnlyLoadAppFromAsar is Enabled' <<<"$fuses"

      - name: Verify package contents
        if: ${{ github.event_name == 'pull_request' || inputs.package_linux }}
        run: |
          pnpm exec asar list dist/linux-unpacked/resources/app.asar > /tmp/asar-files.txt

          if grep -E '\.map$|(^|/)(coverage|tests?|__tests__)(/|$)|(^|/)(electron\.vite\.config\.[^/]+|vitest\.config\.[^/]+|tsconfig\.test\.json)$|/node_modules/pino-pretty/|/node_modules/(node-hid|@serialport/bindings-cpp)/src/|/node_modules/node-hid/hidapi/' /tmp/asar-files.txt; then
            echo 'Unexpected test, coverage, config, source map, source, or development dependency in app.asar'
            exit 1
          fi
          if grep -E '/node_modules/node-hid/prebuilds/(HID-darwin-|HID-win32-|HID(_hidraw)?-linux-(arm|arm64|x64-musl))|/node_modules/@serialport/bindings-cpp/prebuilds/(android-|darwin-|linux-(arm|arm64)|win32-)' /tmp/asar-files.txt; then
            echo 'Unexpected non-Linux-x64 native prebuild in app.asar'
            exit 1
          fi

          test -f dist/linux-unpacked/resources/app.asar.unpacked/node_modules/node-hid/build/Release/HID_hidraw.node
          test -f dist/linux-unpacked/resources/app.asar.unpacked/node_modules/@serialport/bindings-cpp/build/Release/bindings.node

          pacman_package="$(find dist -maxdepth 1 -name '*.pkg.tar.xz' -print -quit)"
          test -n "$pacman_package"
          bsdtar -xOf "$pacman_package" .PKGINFO > /tmp/PKGINFO
          package_root="$(mktemp -d)"
          bsdtar -xf "$pacman_package" -C "$package_root"
          cat /tmp/PKGINFO
          for dependency in c-ares ffmpeg gtk3 http-parser libevent libvpx libxslt libxss minizip nss re2 snappy libnotify libappindicator-gtk3; do
            grep -Fx "depend = $dependency" /tmp/PKGINFO
          done
          for dependency in dbus libpulse pipewire wireplumber; do
            grep -Fx "depend = $dependency" /tmp/PKGINFO
          done

          cmp build/linux/70-streamdeck-deej.rules "$package_root/opt/streamdeck-deej/resources/linux/70-streamdeck-deej.rules"
          test -x "$package_root/opt/streamdeck-deej/resources/linux/install-udev-rule"
          grep -F "install-udev-rule' install" "$package_root/.INSTALL"
          rule_hash="$(sha256sum build/linux/70-streamdeck-deej.rules | cut -d ' ' -f 1)"
          grep -F "if [ \"\$installed_hash\" = '$rule_hash' ]; then" "$package_root/.INSTALL"
          grep -F "rm -f '/etc/udev/rules.d/70-streamdeck-deej.rules'" "$package_root/.INSTALL"
          grep -F 'Warning: preserving modified StreamDeck DeeJ udev rule during package removal.' "$package_root/.INSTALL"
          grep -F 'udevadm control --reload-rules' "$package_root/opt/streamdeck-deej/resources/linux/install-udev-rule"
          grep -F 'udevadm trigger --subsystem-match=hidraw' "$package_root/opt/streamdeck-deej/resources/linux/install-udev-rule"
          grep -F 'udevadm trigger --subsystem-match=tty' "$package_root/opt/streamdeck-deej/resources/linux/install-udev-rule"
          grep -F 'udevadm control --reload-rules' "$package_root/.INSTALL"
          grep -F 'udevadm trigger --subsystem-match=hidraw' "$package_root/.INSTALL"
          grep -F 'udevadm trigger --subsystem-match=tty' "$package_root/.INSTALL"
          if grep -R -E 'MODE="?0666"?|GROUP=' build/linux "$package_root/.INSTALL"; then
            echo 'Unsafe udev permission found in generated assets or pacman hooks'
            exit 1
          fi

          removal_rule="$(mktemp)"
          removal_script="$(mktemp)"
          sed -n '/# BEGIN STREAMDECK DEEJ UDEV OWNERSHIP/,/# END STREAMDECK DEEJ UDEV OWNERSHIP/p' "$package_root/.INSTALL" \
            | sed "s|/etc/udev/rules.d/70-streamdeck-deej.rules|$removal_rule|g; s|if command -v udevadm >/dev/null 2>\&1; then|if false; then|" \
            > "$removal_script"
          chmod 700 "$removal_script"
          cp build/linux/70-streamdeck-deej.rules "$removal_rule"
          "$removal_script"
          test ! -e "$removal_rule"
          cat build/linux/70-streamdeck-deej.rules > "$removal_rule"
          printf '# retained administrator change\n' >> "$removal_rule"
          cp "$removal_rule" "$removal_rule.expected"
          removal_warning="$("$removal_script" 2>&1)"
          grep -F 'Warning: preserving modified StreamDeck DeeJ udev rule during package removal.' <<<"$removal_warning"
          cmp "$removal_rule.expected" "$removal_rule"
          rm -f "$removal_rule" "$removal_rule.expected" "$removal_script"
          rm -rf "$package_root"

          if command -v udevadm >/dev/null 2>&1 && udevadm help | grep -q 'verify'; then
            udevadm verify build/linux/70-streamdeck-deej.rules
          fi

      - name: Smoke unpacked binary and extracted AppImage
        if: ${{ github.event_name == 'pull_request' || inputs.package_linux }}
        run: |
          test "$(id -u)" -ne 0
          for runtime_command in pactl pw-dump wpctl dbus-send; do
            command -v "$runtime_command"
          done

          smoke() {
            local executable="$1"
            local config_dir
            config_dir="$(mktemp -d)"
            set +e
            XDG_CONFIG_HOME="$config_dir" timeout 10s xvfb-run -a "$executable" --no-sandbox > /tmp/smoke.log 2>&1
            local status=$?
            set -e
            rm -rf "$config_dir"
            if grep -F 'A JavaScript error occurred in the main process' /tmp/smoke.log; then
              cat /tmp/smoke.log
              echo "Smoke detected a main-process exception in $executable"
              exit 1
            fi
            grep -F 'Linux updater mode: disabled' /tmp/smoke.log
            if [ "$status" -ne 124 ]; then
              cat /tmp/smoke.log
              echo "Smoke failed for $executable with status $status"
              exit 1
            fi
          }

          smoke dist/linux-unpacked/streamdeck-deej

          appimage="$(find dist -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          appimage="$(realpath "$appimage")"
          extract_dir="$(mktemp -d)"
          (cd "$extract_dir" && "$appimage" --appimage-extract > /dev/null)
          cmp build/linux/70-streamdeck-deej.rules "$extract_dir/squashfs-root/resources/linux/70-streamdeck-deej.rules"
          test -x "$extract_dir/squashfs-root/resources/linux/install-udev-rule"
          smoke "$extract_dir/squashfs-root/AppRun"
          rm -rf "$extract_dir"

      - name: Stage verified release artifacts
        if: ${{ inputs.artifact_name != '' }}
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          version="${EXPECTED_VERSION:-$(node --print 'require("./package.json").version')}"
          artifact_base="streamdeck-deej-$version"
          expected=(
            "dist/$artifact_base.AppImage"
            "dist/$artifact_base.pkg.tar.xz"
            "dist/latest-linux.yml"
          )
          blockmap="dist/$artifact_base.AppImage.blockmap"
          if [[ -e "$blockmap" ]]; then
            expected+=("$blockmap")
          fi

          mapfile -t actual < <(find dist -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.pkg.tar.xz' -o -name 'latest-linux.yml' -o -name '*.blockmap' \) | LC_ALL=C sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [[ "${actual[*]}" = "${expected_sorted[*]}" ]]

          mkdir release-artifacts
          cp -- "${expected[@]}" release-artifacts/
          printf '%s\n' "$version" > release-artifacts/RELEASE_VERSION
          (
            cd release-artifacts
            for file in "$artifact_base.AppImage" "$artifact_base.pkg.tar.xz" latest-linux.yml RELEASE_VERSION; do
              sha256sum "$file"
            done
            if [[ -f "$artifact_base.AppImage.blockmap" ]]; then
              sha256sum "$artifact_base.AppImage.blockmap"
            fi
          ) > release-artifacts/SHA256SUMS

      - name: Transfer verified release artifacts
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
