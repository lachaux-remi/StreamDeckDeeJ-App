name: AUR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to publish to the AUR (for example v4.2.0)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Published release tag to publish to the AUR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Download and verify signed release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$(node --print 'require("./package.json").version')" = "$version"
          gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft,isPrerelease \
            | jq -e '.isDraft == false and .isPrerelease == false' > /dev/null

          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir release-artifacts
          node scripts/update-signing.mjs verify release-artifacts "$version" "$(git rev-parse HEAD)"

          node scripts/prepare-aur-package.mjs \
            "release-artifacts/streamdeck-deej-$version.pkg.tar.xz" "$version" LICENSE aur-package

      - name: Transfer AUR package sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aur-package-prepared
          path: aur-package/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    steps:
      - name: Download AUR package sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aur-package-prepared
          path: aur-package

      - name: Generate .SRCINFO and build the package from its public sources
        run: |
          set -euo pipefail
          useradd --create-home builder
          chown -R builder: aur-package
          su builder -c 'cd aur-package && makepkg --printsrcinfo > .SRCINFO && makepkg --nodeps --noconfirm'
          test -f aur-package/streamdeck-deej-bin-*-x86_64.pkg.tar.zst
          mkdir aur-publish
          cp aur-package/PKGBUILD aur-package/.SRCINFO aur-package/streamdeck-deej-bin.install aur-publish/

      - name: Transfer AUR repository files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aur-package-verified
          path: aur-publish/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: aur
    steps:
      - name: Download AUR repository files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aur-package-verified
          path: aur-publish

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$AUR_SSH_PRIVATE_KEY"
          ssh_directory="$(mktemp -d)"
          trap 'rm -rf "$ssh_directory"' EXIT
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_directory/key"
          chmod 600 "$ssh_directory/key"
          # Ed25519 host key, fingerprint SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          # as published on https://aur.archlinux.org.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > "$ssh_directory/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_directory/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_directory/known_hosts"

          git clone ssh://aur@aur.archlinux.org/streamdeck-deej-bin.git aur-repository
          cp aur-publish/PKGBUILD aur-publish/.SRCINFO aur-publish/streamdeck-deej-bin.install aur-repository/
          cd aur-repository
          git add PKGBUILD .SRCINFO streamdeck-deej-bin.install
          if git diff --cached --quiet; then
            echo "AUR package already up to date for $RELEASE_TAG"
            exit 0
          fi
          git -c user.name='StreamDeck DeeJ Release' -c user.email='contact@remi-lachaux.fr' \
            commit -m "Update to ${RELEASE_TAG#v}"
          git push origin HEAD:master
