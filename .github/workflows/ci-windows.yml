name: Windows CI

on:
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: Immutable ref to check out
        type: string
        default: ''
      expected_version:
        description: Package version expected for a release build
        type: string
        default: ''
      artifact_name:
        description: Name used to transfer verified Windows release artifacts
        type: string
        default: ''

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml', 'electron-builder.yml') }}

      - name: Install dependencies and rebuild native modules
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Compile and load Windows audio module
        shell: pwsh
        run: |
          pnpm build:windows-audio
          $env:ELECTRON_RUN_AS_NODE = '1'
          pnpm exec electron scripts/smoke-windows-audio.cjs

      - name: Check formatting
        run: pnpm exec prettier --check .github/workflows/*.yml electron-builder.yml package.json packages/windows-audio-native/package.json packages/windows-audio-native/index.cjs scripts/*.cjs scripts/*.mjs tests/*.ts

      - name: Typecheck tests
        run: pnpm typecheck:test

      - name: Test Windows and shared behavior
        run: pnpm test:windows

      - name: Lint
        run: pnpm lint

      - name: Typecheck and build application bundles
        run: pnpm build

      - name: Package Windows x64 NSIS
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          if ($env:EXPECTED_VERSION) {
            $version = node --print 'require("./package.json").version'
            if ($version -ne $env:EXPECTED_VERSION) { throw "Expected version $env:EXPECTED_VERSION, found $version" }
          }
          pnpm package:windows

      - name: Verify Windows update metadata
        run: pnpm verify:update-metadata:windows

      - name: Verify package and native modules
        shell: pwsh
        run: |
          $exe = 'dist/win-unpacked/streamdeck-deej.exe'
          if (!(Test-Path $exe)) { throw "Missing unpacked executable: $exe" }
          if (!(Test-Path 'dist/win-unpacked/resources/app.asar.unpacked/node_modules/node-hid/build/Release/HID.node')) { throw 'Missing rebuilt node-hid module' }
          if (!(Test-Path 'dist/win-unpacked/resources/app.asar.unpacked/node_modules/@serialport/bindings-cpp/build/Release/bindings.node')) { throw 'Missing rebuilt serialport module' }
          if (!(Test-Path 'dist/win-unpacked/resources/app.asar.unpacked/node_modules/@streamdeck-deej/windows-audio-native/build/Release/windows_audio.node')) { throw 'Missing Windows audio module outside ASAR' }
          $installer = Get-ChildItem 'dist/streamdeck-deej-*-windows-x64.exe' | Select-Object -First 1
          if (!$installer) { throw 'Missing stable NSIS installer artifact' }
          $blockmap = Get-ChildItem 'dist/streamdeck-deej-*-windows-x64.exe.blockmap' | Select-Object -First 1
          if (!$blockmap) { throw 'Missing NSIS blockmap artifact' }
          if (!(Test-Path 'dist/latest.yml')) { throw 'Missing Windows updater metadata' }

      - name: Smoke unpacked Windows application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/win-unpacked/streamdeck-deej.exe' -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Application exited during smoke test with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

      - name: Stage verified Windows release artifacts
        if: ${{ inputs.artifact_name != '' }}
        shell: pwsh
        run: |
          $version = node --print 'require("./package.json").version'
          $setup = "streamdeck-deej-$version-windows-x64.exe"
          $expected = @($setup, "$setup.blockmap", 'latest.yml')
          $actual = @(Get-ChildItem dist -File | Where-Object { $_.Name -eq 'latest.yml' -or $_.Name -like 'streamdeck-deej-*-windows-x64.exe*' } | ForEach-Object Name)
          if (@(Compare-Object ($expected | Sort-Object) ($actual | Sort-Object)).Count -ne 0) { throw 'Unexpected Windows release artifact set' }

          New-Item -ItemType Directory -Force windows-release | Out-Null
          foreach ($name in $expected) { Copy-Item "dist/$name" "windows-release/$name" }
          [IO.File]::WriteAllText("$PWD/windows-release/RELEASE_VERSION", "$version`n", [Text.UTF8Encoding]::new($false))
          Push-Location windows-release
          $checksums = Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS", ($checksums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          Pop-Location

      - name: Transfer verified Windows release artifacts
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: windows-release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
