name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout immutable release tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Install native build dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev libudev-dev

      - name: Install pnpm
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install Node.js
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Build Linux release artifacts from tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          test "$(git describe --tags --exact-match)" = "${{ steps.release.outputs.tag_name }}"
          test "$(node --print 'require("./package.json").version')" = "${{ steps.release.outputs.version }}"
          pnpm package:linux

      - name: Upload Linux artifacts to GitHub Release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          mapfile -t appimages < <(find dist -maxdepth 1 -type f -name '*.AppImage')
          mapfile -t pacman_packages < <(find dist -maxdepth 1 -type f -name '*.pkg.tar.xz')
          test "${#appimages[@]}" -eq 1
          test "${#pacman_packages[@]}" -eq 1
          gh release upload "$RELEASE_TAG" "${appimages[0]}" "${pacman_packages[0]}"
