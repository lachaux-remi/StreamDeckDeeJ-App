name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/ci.yml
    with:
      package_linux: false

  release-pr:
    needs: validate
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  release-candidate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-please--') &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Validate merged Release Please candidate
        id: candidate
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.merged' <<<"$pr")" = true
          test "$(jq -r '.base.ref' <<<"$pr")" = "$BASE_REF"
          test "$(jq -r '.head.ref' <<<"$pr")" = "$HEAD_REF"
          test "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPOSITORY"
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$MERGE_SHA"
          jq -e '.labels | any(.name == "autorelease: pending")' <<<"$pr" > /dev/null
          test "$EVENT_SHA" = "$MERGE_SHA"

          pending="$(gh api --paginate --slurp "repos/$REPOSITORY/pulls?state=closed&base=$BASE_REF&per_page=100" \
            | jq '[.[][] | select(.merged_at != null and any(.labels[]?; .name == "autorelease: pending")) | .number]')"
          test "$(jq 'length' <<<"$pending")" -eq 1
          test "$(jq -r '.[0]' <<<"$pending")" = "$PR_NUMBER"
          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

  build-release:
    needs: release-candidate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.release-candidate.outputs.sha }}
      artifact_name: ${{ format('linux-release-{0}', needs.release-candidate.outputs.sha) }}

  validate-release-artifacts:
    needs: [release-candidate, build-release]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ format('linux-release-{0}', needs.release-candidate.outputs.sha) }}
          path: release-artifacts

      - name: Validate transferred Linux artifacts
        run: |
          set -euo pipefail
          cd release-artifacts
          version="$(cat RELEASE_VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          artifact_base="streamdeck-deej-$version"
          expected=(
            "$artifact_base.AppImage"
            "$artifact_base.pkg.tar.xz"
            latest-linux.yml
            RELEASE_VERSION
            SHA256SUMS
          )
          if [[ -e "$artifact_base.AppImage.blockmap" ]]; then
            expected+=("$artifact_base.AppImage.blockmap")
          fi

          mapfile -t actual < <(find . -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [[ "${actual[*]}" = "${expected_sorted[*]}" ]]
          test "$(find . -mindepth 1 -maxdepth 1 ! -type f -print -quit)" = ''
          sha256sum --check --strict SHA256SUMS

  attest-release:
    needs: [release-candidate, validate-release-artifacts]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ format('linux-release-{0}', needs.release-candidate.outputs.sha) }}
          path: release-artifacts

      - name: Attest verified Linux artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*

  create-release:
    needs: [release-candidate, attest-release]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create immutable tag and GitHub release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Match release to the verified commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VERIFIED_SHA: ${{ needs.release-candidate.outputs.sha }}
        run: test "$RELEASE_SHA" = "$VERIFIED_SHA"

  publish-release:
    needs: create-release
    if: ${{ needs.create-release.outputs.release_created == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ format('linux-release-{0}', github.sha) }}
          path: release-artifacts

      - name: Validate transferred Linux artifacts
        env:
          EXPECTED_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          cd release-artifacts
          test "$(cat RELEASE_VERSION)" = "$EXPECTED_VERSION"
          artifact_base="streamdeck-deej-$EXPECTED_VERSION"
          expected=(
            "$artifact_base.AppImage"
            "$artifact_base.pkg.tar.xz"
            latest-linux.yml
            RELEASE_VERSION
            SHA256SUMS
          )
          if [[ -e "$artifact_base.AppImage.blockmap" ]]; then
            expected+=("$artifact_base.AppImage.blockmap")
          fi

          mapfile -t actual < <(find . -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [[ "${actual[*]}" = "${expected_sorted[*]}" ]]
          test "$(find . -mindepth 1 -maxdepth 1 ! -type f -print -quit)" = ''
          sha256sum --check --strict SHA256SUMS

      - name: Upload Linux artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          artifact_base="release-artifacts/streamdeck-deej-$RELEASE_VERSION"
          artifacts=(
            "$artifact_base.AppImage"
            "$artifact_base.pkg.tar.xz"
            release-artifacts/latest-linux.yml
          )
          if [[ -f "$artifact_base.AppImage.blockmap" ]]; then
            artifacts+=("$artifact_base.AppImage.blockmap")
          fi
          gh release upload "$RELEASE_TAG" --clobber -- "${artifacts[@]}"
