name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      package_linux: false

  release-candidate:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.candidate.outputs.release }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Detect merged Release Please candidate
        id: candidate
        env:
          BASE_REF: ${{ github.ref_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$EVENT_REF" = "refs/heads/$BASE_REF"

          candidates="$(gh api "repos/$REPOSITORY/commits/$EVENT_SHA/pulls?per_page=100" \
            | jq --arg base "$BASE_REF" --arg repo "$REPOSITORY" --arg sha "$EVENT_SHA" \
              '[.[] | select(
                .merged_at != null and
                .merge_commit_sha == $sha and
                .base.ref == $base and
                .head.repo.full_name == $repo and
                (.head.ref | startswith("release-please--")) and
                any(.labels[]?; .name == "autorelease: pending")
              )]')"

          count="$(jq 'length' <<<"$candidates")"
          if [[ "$count" -eq 0 ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$count" -eq 1

          pr_number="$(jq -r '.[0].number' <<<"$candidates")"
          pr="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          test "$(jq -r '.merged' <<<"$pr")" = true
          test "$(jq -r '.base.ref' <<<"$pr")" = "$BASE_REF"
          test "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$REPOSITORY"
          test "$(jq -r '.merge_commit_sha' <<<"$pr")" = "$EVENT_SHA"
          jq -e '.head.ref | startswith("release-please--")' <<<"$pr" > /dev/null
          jq -e '.labels | any(.name == "autorelease: pending")' <<<"$pr" > /dev/null

          pending="$(gh api --paginate --slurp "repos/$REPOSITORY/pulls?state=closed&base=$BASE_REF&per_page=100" \
            | jq '[.[][] | select(.merged_at != null and any(.labels[]?; .name == "autorelease: pending")) | .number]')"
          test "$(jq 'length' <<<"$pending")" -eq 1
          test "$(jq -r '.[0]' <<<"$pending")" = "$pr_number"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"

  release-pr:
    needs: [validate, release-candidate]
    if: ${{ needs.release-candidate.outputs.release != 'true' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  build-release:
    needs: release-candidate
    if: ${{ needs.release-candidate.outputs.release == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ needs.release-candidate.outputs.sha }}
      artifact_name: ${{ format('linux-release-{0}', needs.release-candidate.outputs.sha) }}

  validate-release-artifacts:
    needs: [release-candidate, build-release]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ format('linux-release-{0}', needs.release-candidate.outputs.sha) }}
          path: release-artifacts

      - name: Validate transferred Linux artifacts
        run: |
          set -euo pipefail
          cd release-artifacts
          version="$(cat RELEASE_VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          artifact_base="streamdeck-deej-$version"
          expected=(
            "$artifact_base.AppImage"
            "$artifact_base.pkg.tar.xz"
            latest-linux.yml
            RELEASE_VERSION
            SHA256SUMS
          )
          if [[ -e "$artifact_base.AppImage.blockmap" ]]; then
            expected+=("$artifact_base.AppImage.blockmap")
          fi

          mapfile -t actual < <(find . -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [[ "${actual[*]}" = "${expected_sorted[*]}" ]]
          test "$(find . -mindepth 1 -maxdepth 1 ! -type f -print -quit)" = ''
          sha256sum --check --strict SHA256SUMS

  sign-release-artifacts:
    needs: [release-candidate, validate-release-artifacts]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: release-signing
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-candidate.outputs.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Download verified Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ format('linux-release-{0}', needs.release-candidate.outputs.sha) }}
          path: release-artifacts

      - name: Sign canonical update manifest with Ed25519
        env:
          RELEASE_COMMIT: ${{ needs.release-candidate.outputs.sha }}
          UPDATE_SIGNING_KEY_PASSPHRASE: ${{ secrets.UPDATE_SIGNING_KEY_PASSPHRASE }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          (cd release-artifacts && sha256sum --check --strict SHA256SUMS)
          version="$(cat release-artifacts/RELEASE_VERSION)"
          node scripts/update-signing.mjs sign release-artifacts "$version" "$RELEASE_COMMIT"

      - name: Transfer signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ format('linux-signed-release-{0}', needs.release-candidate.outputs.sha) }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  attest-release:
    needs: [release-candidate, sign-release-artifacts]
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ format('linux-signed-release-{0}', needs.release-candidate.outputs.sha) }}
          path: release-artifacts

      - name: Attest verified Linux artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*

  create-release:
    needs: [release-candidate, attest-release]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create immutable tag and GitHub release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Match release to the verified commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          VERIFIED_SHA: ${{ needs.release-candidate.outputs.sha }}
        run: test "$RELEASE_SHA" = "$VERIFIED_SHA"

  publish-release:
    needs: [release-candidate, create-release]
    if: ${{ needs.create-release.outputs.release_created == 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-candidate.outputs.sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Download verified Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ format('linux-signed-release-{0}', needs.release-candidate.outputs.sha) }}
          path: release-artifacts

      - name: Validate transferred Linux artifacts
        env:
          EXPECTED_COMMIT: ${{ needs.release-candidate.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          cd release-artifacts
          test "$(cat RELEASE_VERSION)" = "$EXPECTED_VERSION"
          artifact_base="streamdeck-deej-$EXPECTED_VERSION"
          expected=(
            "$artifact_base.AppImage"
            "$artifact_base.pkg.tar.xz"
            latest-linux.yml
            RELEASE_VERSION
            SHA256SUMS
            update-manifest-v1.json
            update-manifest-v1.sig
          )
          if [[ -e "$artifact_base.AppImage.blockmap" ]]; then
            expected+=("$artifact_base.AppImage.blockmap")
          fi

          mapfile -t actual < <(find . -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [[ "${actual[*]}" = "${expected_sorted[*]}" ]]
          test "$(find . -mindepth 1 -maxdepth 1 ! -type f -print -quit)" = ''
          sha256sum --check --strict SHA256SUMS
          cd ..
          node scripts/update-signing.mjs verify release-artifacts "$EXPECTED_VERSION" "$EXPECTED_COMMIT"

      - name: Upload Linux artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          artifact_base="release-artifacts/streamdeck-deej-$RELEASE_VERSION"
          artifacts=(
            "$artifact_base.AppImage"
            "$artifact_base.pkg.tar.xz"
            release-artifacts/latest-linux.yml
            release-artifacts/update-manifest-v1.json
            release-artifacts/update-manifest-v1.sig
          )
          if [[ -f "$artifact_base.AppImage.blockmap" ]]; then
            artifacts+=("$artifact_base.AppImage.blockmap")
          fi
          gh release upload "$RELEASE_TAG" --clobber -- "${artifacts[@]}"
